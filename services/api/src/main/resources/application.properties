app.jwt.secret=java-academy-development-secret-key-must-be-at-least-32-bytes-long
app.jwt.expiration-ms=86400000

spring.application.name=api

spring.datasource.url=jdbc:postgresql://localhost:5432/java_academy
spring.datasource.username=academy
spring.datasource.password=academy

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
